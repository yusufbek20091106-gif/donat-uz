<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>OBS Donat Vidjeti Pro</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .alert-box {
      display: none;
      flex-direction: column;
      align-items: center;
      background: rgba(18, 20, 32, 0.96);
      border: 3px solid #00ff88;
      box-shadow: 0 0 45px rgba(0, 255, 136, 0.7), inset 0 0 25px rgba(0, 255, 136, 0.25);
      border-radius: 26px;
      padding: 26px 40px;
      max-width: 540px;
      text-align: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.3) translateY(80px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .badge-icon {
      font-size: 58px;
      margin-bottom: 8px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }

    .title {
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .name {
      color: #00ff88;
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.6);
    }

    .amount {
      color: #ffd700;
      font-size: 36px;
      font-weight: 900;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 12px;
    }

    .message {
      color: #edf2f7;
      font-size: 20px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 20px;
      line-height: 1.45;
      word-break: break-word;
      max-width: 460px;
    }

    .video-container {
      display: none;
      margin-top: 15px;
      width: 440px;
      height: 250px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #ffd700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .system-tag {
      margin-top: 12px;
      font-size: 13px;
      color: #8c93ad;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
</head>
<body>

  <div class="alert-box" id="alertBox">
    <div class="badge-icon" id="badgeIcon">🔥</div>
    <div class="title"><span class="name" id="donorName">Jasur</span> donat qildi!</div>
    <div class="amount" id="donorAmount">50,000 UZS</div>
    <div class="message" id="donorMessage">Zo'r o'yin!</div>
    
    <div class="video-container" id="videoContainer">
      <iframe id="videoPlayer" allow="autoplay"></iframe>
    </div>

    <div class="system-tag" id="donorSystem">Click orqali</div>
  </div>

  <script>
    const socket = io();
    const alertBox = document.getElementById('alertBox');
    const donorName = document.getElementById('donorName');
    const donorAmount = document.getElementById('donorAmount');
    const donorMessage = document.getElementById('donorMessage');
    const donorSystem = document.getElementById('donorSystem');
    const videoContainer = document.getElementById('videoContainer');
    const videoPlayer = document.getElementById('videoPlayer');

    let currentSettings = {
      minTtsAmount: 5000,
      alertDuration: 5,
      alertSound: 'chime'
    };

    socket.on('settings_updated', (s) => {
      if (s) currentSettings = Object.assign(currentSettings, s);
    });

    // Ovoz effektlari generatori (Web Audio API)
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        if (type === 'coin') {
          // Mario / Coin effekti
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, ctx.currentTime); // B5
          osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08); // E6
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'winner') {
          // PUBG Winner Fanfare
          const freqs = [523, 659, 783, 1046];
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = f;
            gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.5);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08); osc.stop(ctx.currentTime + i * 0.08 + 0.5);
          });
        } else {
          // Standart Chime
          [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = f;
            gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.4);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.1); osc.stop(ctx.currentTime + i * 0.1 + 0.4);
          });
        }
      } catch (e) {
        console.log('Audio error:', e);
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window && text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    let isPlaying = false;
    const queue = [];

    function processQueue() {
      if (queue.length === 0) {
        isPlaying = false;
        alertBox.style.display = 'none';
        videoContainer.style.display = 'none';
        videoPlayer.src = '';
        return;
      }

      isPlaying = true;
      const data = queue.shift();

      donorName.innerText = data.username;
      donorAmount.innerText = Number(data.amount).toLocaleString('uz-UZ') + ' so`m';
      donorMessage.innerText = data.message ? `"${data.message}"` : '';
      donorMessage.style.display = data.message ? 'block' : 'none';
      donorSystem.innerText = (data.system || 'Click') + ' orqali';

      // YouTube Media Klip bormi?
      let duration = (currentSettings.alertDuration || 5) * 1000;
      if (data.youtubeId) {
        videoContainer.style.display = 'block';
        videoPlayer.src = `https://www.youtube.com/embed/${data.youtubeId}?autoplay=1&start=0`;
        duration = 15000; // Videoli donat 15 soniya qo'yiladi
      } else {
        videoContainer.style.display = 'none';
        videoPlayer.src = '';
      }

      alertBox.style.display = 'flex';
      playSound(currentSettings.alertSound || 'winner');

      setTimeout(() => {
        if (data.message && data.amount >= currentSettings.minTtsAmount) {
          speak(`${data.username}dan ${data.amount} so'm. ${data.message}`);
        }
      }, 700);

      setTimeout(() => {
        processQueue();
      }, duration);
    }

    socket.on('new_donation', (data) => {
      queue.push(data);
      if (!isPlaying) {
        processQueue();
      }
    });
  </script>
</body>
</html>
